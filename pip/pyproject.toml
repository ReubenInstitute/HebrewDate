[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "python-hebrewdate"
version = "0.9"
description = "Hebrew calendar utilities — dates, holidays, and Torah reading schedule"
readme = { text = "Hebrew calendar utilities — dates, holidays, and Torah reading schedule.", content-type = "text/plain" }
license = "GPL-3.0-or-later"
requires-python = ">=3.8"
dependencies = [
    "python-date",
]

[tool.setuptools]
packages = ["hebrewdate"]

[tool.setuptools.package-dir]
hebrewdate = "."
