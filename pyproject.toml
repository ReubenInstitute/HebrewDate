[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "HebrewDate"
version = "3.7"
description = "Hebrew calendar utilities from Reuben Institute — dates, holidays, and Torah reading schedule"
readme = { text = "Hebrew calendar utilities from Reuben Institute — dates, holidays, and Torah reading schedule.", content-type = "text/plain" }
license = "GPL-3.0-or-later"
requires-python = ">=3.8"
dependencies = [
    "Date",
]

[tool.setuptools]
py-modules = ["HebrewDate", "HebrewHoliday", "TorahSchedule"]
